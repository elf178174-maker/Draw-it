org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile Kotlin inside the Gradle process. Spawning a separate Kotlin daemon is a
# known source of hangs on CI runners, and there is not enough here to be worth it.
kotlin.compiler.execution.strategy=in-process

# Never let a stalled download block the build indefinitely.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
