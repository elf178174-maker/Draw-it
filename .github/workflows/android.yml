name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Secrets cannot be read from an `if:` directly, so surface it as an env flag.
      HAS_CI_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use the signing key from repository secrets
        if: env.HAS_CI_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/ci-release.jks
          {
            echo "storeFile=keystore/ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build both APKs
        timeout-minutes: 30
        run: ./gradlew assembleDebug assembleRelease --console=plain --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/draw-it.apk
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/draw-it-debug.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: draw-it-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish a downloadable release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" artifacts/draw-it.apk artifacts/draw-it-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Draw it — latest build ($GITHUB_REF_NAME)" \
            --notes "Automatic build of \`$GITHUB_REF_NAME\` at commit \`$GITHUB_SHA\`.

          **draw-it.apk** is the one to install on your phone.
          \`draw-it-debug.apk\` installs alongside it as a separate app, for testing.

          Android will warn that the file comes from an unknown source — allow the install from your browser or file manager to continue."
